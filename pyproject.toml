[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-tuning-lab"
version = "1.0.0"
description = "Reproducible hardware-aware kernel tuning and variant selection research"
authors = [{name = "MingASA", email = "mingasa7@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
gpu = ["torch>=2.2", "triton>=3.0; platform_system == 'Linux'"]
gpu-blackwell = ["torch>=2.7", "triton>=3.3; platform_system == 'Linux'"]
dev = ["pytest>=8"]
optimizers = ["smac==2.4.1", "ConfigSpace==1.2.2", "kernel_tuner==1.5.0",
              "numpy==2.2.2", "scipy==1.15.3", "scikit-learn==1.6.1",
              "pandas==2.2.3", "pymoo==0.6.1.6"]

[project.scripts]
ktlab = "kernel_tuning_lab.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "third_party/triton-tutorial-LICENSE", "kernel_tuning_lab/production/upstream/LICENSE", "kernel_tuning_lab/production/upstream/suite/*/LICENSE"]

[tool.setuptools.packages.find]
include = ["kernel_tuning_lab*"]

[tool.setuptools.package-data]
kernel_tuning_lab = ["web_assets/*", "adapters/data/*.json", "adapters/data/*.txt", "production/upstream/*.json", "production/upstream/LICENSE", "production/upstream/suite/*.json", "production/upstream/suite/*/*.py", "production/upstream/suite/*/*.hpp", "production/upstream/suite/*/*.cpp", "production/upstream/suite/*/*.cu", "production/upstream/suite/*/LICENSE", "production/upstream/suite/*/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
